<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Fire LoRa Cerrado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
</head>
<body>

  <div id="login-overlay">
    <div class="login-box">
      <span class="login-icon">&#9650;</span>
      <h2>Dashboard</h2>
      <p>Enter the API password to open the live charts.</p>
      <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
      <label class="remember-row">
        <input type="checkbox" id="remember-me" checked>
        Keep me signed in on this device
      </label>
      <button id="login-btn">Login</button>
      <p id="login-error" class="error hidden">Wrong password. Try again.</p>
      <p class="login-foot"><a href="/">&larr; Public site</a></p>
    </div>
  </div>

  <header>
    <div class="header-title">
      <span class="header-icon">&#9650;</span>
      Fire LoRa &mdash; Dashboard
    </div>
    <div class="header-meta">
      <a href="/">&larr; Public site</a>
      <span id="refresh-badge">Refreshing in <span id="refresh-countdown">30</span>s</span>
      <button id="logout-btn" class="btn-quiet" title="Sign out">Logout</button>
    </div>
  </header>

  <main>
    <section class="section">
      <h2 class="section-title">Current state</h2>
      <div id="sensor-grid" class="sensor-grid">
        <p class="placeholder">Loading sensors&hellip;</p>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">Live graphs</h2>
      <div class="chart-controls">
        <div class="controls-row">
          <div class="search-group">
            <label for="sensor-select">Sensor</label>
            <select id="sensor-select">
              <option value="">All sensors</option>
            </select>
          </div>
          <div class="preset-group">
            <label>Range</label>
            <div class="preset-btns">
              <button class="preset-btn" data-preset="1h">1h</button>
              <button class="preset-btn" data-preset="6h">6h</button>
              <button class="preset-btn active" data-preset="24h">24h</button>
              <button class="preset-btn" data-preset="7d">7d</button>
              <button class="preset-btn" data-preset="custom">Custom</button>
            </div>
          </div>
        </div>
        <div id="custom-range" class="controls-row hidden">
          <div class="search-group">
            <label for="from-dt">From</label>
            <input type="datetime-local" id="from-dt">
          </div>
          <div class="search-group">
            <label for="to-dt">To</label>
            <input type="datetime-local" id="to-dt">
          </div>
          <button id="apply-custom-btn">Apply</button>
        </div>
      </div>
      <div id="charts-grid" class="charts-grid">
        <p class="placeholder" style="padding:1rem">Loading data&hellip;</p>
      </div>
    </section>
  </main>

  <script src="/static/app.js" defer></script>
</body>
</html>
