name: firmware

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tests/run.sh

  compile:
    runs-on: ubuntu-latest
    env:
      FQBN: esp32:esp32:heltec_wifi_lora_32_V3
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install core and libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install \
            "Adafruit BME280 Library" \
            "Adafruit Unified Sensor" \
            "RadioLib" \
            "ESP8266 and ESP32 OLED driver for SSD1306 displays"

      - name: Provide secrets.h
        run: |
          cp secrets.example.h secrets.h
          ln -sf ../secrets.h sensor/secrets.h
          ln -sf ../secrets.h gateway/secrets.h

      - name: Compile every target
        run: |
          set -e
          compile() {
            echo "::group::$*"
            arduino-cli compile --fqbn "$FQBN" --warnings all "$@"
            echo "::endgroup::"
          }
          compile sensor
          compile --build-property "compiler.cpp.extra_flags=-DSENSOR_ID=3" sensor
          compile --build-property "compiler.cpp.extra_flags=-DCAMERA" sensor
          compile --build-property "compiler.cpp.extra_flags=-DTX_INTERVAL=1800000UL" sensor
          compile gateway
